<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Sign In</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div id="toast" class="toast"></div>

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-brand">
            <div class="brand-icon">
                <i class="fas fa-layer-group"></i>
            </div>
            <span class="brand-name">TaskFlow</span>
        </div>

        <h1 class="auth-headline">Welcome back</h1>
        <p class="auth-sub">Sign in to continue to your workspace.</p>

        <div class="field-group">
            <label class="field-label" for="loginEmail">Email Address</label>
            <input class="field-input" type="email" id="loginEmail" placeholder="you@example.com">
        </div>

        <div class="field-group">
            <label class="field-label" for="loginPassword">Password</label>
            <input class="field-input" type="password" id="loginPassword" placeholder="Your password">
        </div>

        <button class="btn-primary" onclick="login()" id="loginBtn">
            Sign In
        </button>

        <div class="auth-divider">
            New to TaskFlow? <a href="register.html">Create an account</a>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
